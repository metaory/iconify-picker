<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Iconify Picker</title>
  <style>
    :root {
      --bg: #0CBBEE44;
      --fg: #220033;
      --radius: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
    }
    body {
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
    }
    p {
      font-size: 1.25rem;
      opacity: 0.8;
    }
    a {
      color: var(--fg);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      background: #ffffff22;
      display: inline-block;
      margin-top: 1rem;
    }
    a:hover {
      background: #ffffff44;
    }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Page not found</p>
    <a href="index.html">Go Home</a>
  </div>
</body>
</html>
